name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: lint + tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install bats and shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats shellcheck

      - name: Syntax check
        run: |
          bash -n tmxssh
          bash -n install.sh

      - name: ShellCheck
        run: shellcheck -x tmxssh install.sh

      - name: Bats tests
        run: bats --print-output-on-failure tests/
