name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: package + publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Verify the tag matches TMXSSH_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^TMXSSH_VERSION="\(.*\)"/\1/p' tmxssh)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match TMXSSH_VERSION=$version" >&2
            exit 1
          fi

      - name: Build the release archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="tmxssh-${version}"
          mkdir -p "dist/${name}"
          cp tmxssh install.sh README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
